# Example configuration for the Omlet Smart Autodoor control panel (board X107).
# Pin assignments come from the stock firmware, see README.md.

esphome:
  name: coop-door
  friendly_name: Coop Door

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source: github://swoboda1337/omlet-esphome
    components: [omlet_door, lcd_st7032]

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Motor current: shunt amplifier output, only enabled while the door moves.
sensor:
  - platform: adc
    id: motor_current
    pin: GPIO9
    attenuation: 12db
    update_interval: never
    internal: true

binary_sensor:
  # Optional: expose the crush switch to Home Assistant as well. The cover owns the
  # interrupt on this pin, so both uses must set allow_other_uses.
  - platform: gpio
    name: Crush Switch
    pin:
      number: GPIO40
      mode: input
      allow_other_uses: true
    device_class: problem

  - platform: gpio
    name: Mains Power
    pin:
      number: GPIO48
      mode: input
    device_class: power

cover:
  - platform: omlet_door
    id: coop_door
    name: Door
    high_side_a: GPIO13
    low_side_a: GPIO12
    high_side_b: GPIO11
    low_side_b: GPIO14
    current_sampler: motor_current
    current_enable_pin: GPIO45
    # Crush switch on the yellow pair of the DOOR connector. The ISR cuts the motor
    # the moment it closes while the door is closing. Add "inverted: true" if the
    # switch reads active-low on your board.
    crush_pin:
      number: GPIO40
      mode: input
      allow_other_uses: true
    # Set to true if "open" drives the door the wrong way.
    invert_direction: false
    max_duration: 30s
    start_sensing_delay: 300ms
    stall_time: 100ms
    # Leave stall_threshold unset to use the value learned by calibration.
    stall_ratio: 2.0
    max_crush_retries: 3
    crush_retry_delay: 10s

button:
  - platform: template
    name: Calibrate Door
    on_press:
      - omlet_door.calibrate: coop_door

i2c:
  sda: GPIO5
  scl: GPIO4
  frequency: 100kHz

display:
  - platform: lcd_st7032
    id: lcd
    dimensions: 16x2
    address: 0x3E
    # GPIO7 is driven low by the stock firmware to power the display; adjust
    # "inverted" if yours stays dark.
    enable_pin:
      number: GPIO7
      inverted: true
    reset_pin: GPIO6
    backlight_pin: GPIO47
    contrast: 22
    update_interval: 1s
    lambda: |-
      it.print(0, 0, "Coop Door");
      if (id(coop_door).current_operation == COVER_OPERATION_OPENING) {
        it.print(0, 1, "Opening...");
      } else if (id(coop_door).current_operation == COVER_OPERATION_CLOSING) {
        it.print(0, 1, "Closing...");
      } else if (id(coop_door).is_fully_open()) {
        it.print(0, 1, "Open");
      } else if (id(coop_door).is_fully_closed()) {
        it.print(0, 1, "Closed");
      } else {
        it.printf(0, 1, "%.0f%%", id(coop_door).position * 100);
      }

light:
  - platform: binary
    name: Coop Light
    output: coop_light_out

output:
  - platform: gpio
    id: coop_light_out
    pin: GPIO8
